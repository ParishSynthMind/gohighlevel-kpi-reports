name: tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - name: Mock end-to-end run (no accounts, template summary)
        run: python -m ghl_kpi run --mock --no-ai --with-conversations --db sqlite:///ci.db --out out

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ghl_kpi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ghl_kpi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt "psycopg[binary]>=3.1"
      - run: pytest -q
      - name: Mock end-to-end run on Postgres
        run: python -m ghl_kpi run --mock --no-ai --with-conversations --db "$TEST_DATABASE_URL" --out out
